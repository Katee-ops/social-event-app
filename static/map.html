<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .event-icon { font-size: 28px; line-height: 28px; text-align: center; }
    #locate {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      padding: 10px 14px; border: none; border-radius: 8px;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
      font-size: 14px; cursor: pointer;
    }
    .event-form { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
    .event-form input { padding: 6px; font-size: 14px; }
    .event-form button { padding: 8px; cursor: pointer; }
    .event-form .error { color: #c00; font-size: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="locate">&#128205; My location</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-1.2921, 36.8219], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const eventIcon = L.divIcon({
      html: '\u{1F389}',
      className: 'event-icon',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    function popupFor(ev) {
      const box = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = ev.title;
      const where = document.createElement('div');
      where.textContent = ev.location;
      const when = document.createElement('div');
      when.textContent = new Date(ev.date).toLocaleString();
      const host = document.createElement('div');
      host.textContent = 'Host: ' + ev.host;
      box.append(title, where, when, host);
      return box;
    }

    function addEventMarker(ev) {
      return L.marker([ev.latitude, ev.longitude], { icon: eventIcon })
        .addTo(map)
        .bindPopup(popupFor(ev));
    }

    async function loadEvents() {
      try {
        const res = await fetch('/events');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const events = await res.json();
        const markers = events.map(addEventMarker);
        if (markers.length) {
          map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
        }
      } catch (err) {
        console.error('Could not load events:', err);
      }
    }

    let youMarker = null;

    function showMyLocation() {
      if (!navigator.geolocation) {
        alert('Location is not supported on this device.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const here = [pos.coords.latitude, pos.coords.longitude];
          if (youMarker) map.removeLayer(youMarker);
          youMarker = L.circleMarker(here, {
            radius: 9, color: '#fff', weight: 3,
            fillColor: '#2a7de1', fillOpacity: 1
          }).addTo(map).bindPopup('You are here');
          map.setView(here, 14);
        },
        () => alert('Could not get your location. Check your permissions.'),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
    document.getElementById('locate').addEventListener('click', showMyLocation);

    function makeInput(placeholder, type = 'text') {
      const input = document.createElement('input');
      input.type = type;
      input.placeholder = placeholder;
      return input;
    }

    map.on('click', e => {
      const form = document.createElement('div');
      form.className = 'event-form';

      const title = makeInput('Event title');
      const location = makeInput('Place name (e.g. Kilimani)');
      const date = makeInput('', 'datetime-local');
      const host = makeInput('Your name');
      const error = document.createElement('div');
      error.className = 'error';
      const save = document.createElement('button');
      save.textContent = 'Create event';

      save.addEventListener('click', async () => {
        error.textContent = '';
        if (!title.value.trim() || !location.value.trim() || !date.value || !host.value.trim()) {
          error.textContent = 'Please fill in every field.';
          return;
        }
        try {
          const res = await fetch('/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: title.value.trim(),
              location: location.value.trim(),
              date: date.value,
              host: host.value.trim(),
              latitude: e.latlng.lat,
              longitude: e.latlng.lng
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const created = await res.json();
          map.closePopup();
          addEventMarker(created).openPopup();
        } catch (err) {
          error.textContent = 'Could not save the event. Try again.';
          console.error(err);
        }
      });

      form.append(title, location, date, host, save, error);
      L.popup().setLatLng(e.latlng).setContent(form).openOn(map);
    });

    loadEvents();
  </script>
</body>
</html>
